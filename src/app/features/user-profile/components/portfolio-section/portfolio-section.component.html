<div class="card h-100">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="card-title mb-0">
      <i class="mdi mdi-link-variant me-2"></i>
      Portafolio
    </h5>
    <button
      type="button"
      class="btn btn-sm"
      [class.btn-primary]="!showForm()"
      [class.btn-outline-secondary]="showForm()"
      (click)="toggleForm()"
    >
      <i
        class="mdi"
        [class.mdi-plus]="!showForm()"
        [class.mdi-close]="showForm()"
      ></i>
    </button>
  </div>
  <div class="card-body">
    <!-- Formulario para agregar -->
    @if (showForm()) {
      <form
        [formGroup]="portfolioForm"
        (ngSubmit)="addPortfolio()"
        class="mb-4"
      >
        <div class="row g-2">
          <div class="col-12">
            <input
              type="text"
              class="form-control form-control-sm"
              formControlName="title"
              placeholder="Título (ej: Mi Portfolio)"
            />
          </div>
          <div class="col-8">
            <input
              type="url"
              class="form-control form-control-sm"
              formControlName="url"
              placeholder="https://..."
            />
          </div>
          <div class="col-4">
            <select class="form-select form-select-sm" formControlName="type">
              @for (type of types; track type.value) {
                <option [value]="type.value">{{ type.label }}</option>
              }
            </select>
          </div>
          <div class="col-12">
            <textarea
              class="form-control form-control-sm"
              formControlName="description"
              rows="2"
              placeholder="Descripción breve (opcional)"
            ></textarea>
          </div>
          <div class="col-12">
            <button
              type="submit"
              class="btn btn-primary btn-sm w-100"
              [disabled]="portfolioForm.invalid || isAdding()"
            >
              @if (isAdding()) {
                <span class="spinner-border spinner-border-sm me-1"></span>
                Agregando...
              } @else {
                <i class="mdi mdi-plus me-1"></i>
                Agregar Enlace
              }
            </button>
          </div>
        </div>
      </form>
    }

    <!-- Lista de enlaces -->
    @if (portfolios.length > 0) {
      <div class="portfolio-list">
        @for (item of portfolios; track item.id) {
          <div class="portfolio-item">
            <div class="d-flex align-items-start gap-3">
              <div class="portfolio-icon">
                <i class="mdi {{ getTypeInfo(item.type).icon }}"></i>
              </div>
              <div class="flex-grow-1 overflow-hidden">
                <h6 class="mb-1 text-truncate">{{ item.title }}</h6>
                <a
                  [href]="item.url"
                  target="_blank"
                  class="text-primary small text-truncate d-block"
                >
                  {{ item.url }}
                </a>
                @if (item.description) {
                  <p class="text-muted small mb-0 mt-1">
                    {{ item.description }}
                  </p>
                }
              </div>
              <div class="d-flex gap-1">
                <button
                  type="button"
                  class="btn btn-link btn-sm text-primary p-0"
                  (click)="openLink(item.url)"
                  title="Abrir enlace"
                >
                  <i class="mdi mdi-open-in-new"></i>
                </button>
                <button
                  type="button"
                  class="btn btn-link btn-sm text-danger p-0"
                  (click)="deletePortfolio(item)"
                  [disabled]="deletingId() === item.id"
                  title="Eliminar"
                >
                  @if (deletingId() === item.id) {
                    <span class="spinner-border spinner-border-sm"></span>
                  } @else {
                    <i class="mdi mdi-close"></i>
                  }
                </button>
              </div>
            </div>
          </div>
        }
      </div>
    } @else if (!showForm()) {
      <div class="text-center py-4">
        <i class="mdi mdi-link-off text-muted fs-1"></i>
        <p class="text-muted mb-0">No has agregado enlaces de portafolio</p>
        <button
          type="button"
          class="btn btn-link btn-sm"
          (click)="toggleForm()"
        >
          Agregar primer enlace
        </button>
      </div>
    }
  </div>
</div>
