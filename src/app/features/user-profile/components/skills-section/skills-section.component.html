<div class="card h-100">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="card-title mb-0">
      <i class="mdi mdi-star me-2"></i>
      Habilidades
    </h5>
    <button
      type="button"
      class="btn btn-sm"
      [class.btn-primary]="!showForm()"
      [class.btn-outline-secondary]="showForm()"
      (click)="toggleForm()"
    >
      <i
        class="mdi"
        [class.mdi-plus]="!showForm()"
        [class.mdi-close]="showForm()"
      ></i>
    </button>
  </div>
  <div class="card-body">
    <!-- Formulario para agregar -->
    @if (showForm()) {
      <form [formGroup]="skillForm" (ngSubmit)="addSkill()" class="mb-4">
        <div class="row g-2">
          <div class="col-12 col-sm-6">
            <input
              type="text"
              class="form-control form-control-sm"
              formControlName="name"
              placeholder="Nombre de la habilidad"
            />
          </div>
          <div class="col-8 col-sm-4">
            <select class="form-select form-select-sm" formControlName="level">
              @for (level of levels; track level.value) {
                <option [value]="level.value">{{ level.label }}</option>
              }
            </select>
          </div>
          <div class="col-4 col-sm-2">
            <button
              type="submit"
              class="btn btn-primary btn-sm w-100"
              [disabled]="skillForm.invalid || isAdding()"
            >
              @if (isAdding()) {
                <span class="spinner-border spinner-border-sm"></span>
              } @else {
                <i class="mdi mdi-check"></i>
              }
            </button>
          </div>
        </div>
      </form>
    }

    <!-- Lista de habilidades -->
    @if (skills.length > 0) {
      <div class="skills-list">
        @for (skill of skills; track skill.id) {
          <div
            class="skill-item d-flex align-items-center justify-content-between"
          >
            <div class="d-flex align-items-center gap-2">
              <span class="skill-name">{{ skill.name }}</span>
              <span
                class="badge bg-{{
                  getLevelInfo(skill.level).color
                }}-subtle text-{{ getLevelInfo(skill.level).color }}"
              >
                {{ getLevelInfo(skill.level).label }}
              </span>
            </div>
            <button
              type="button"
              class="btn btn-link btn-sm text-danger p-0"
              (click)="deleteSkill(skill)"
              [disabled]="deletingId() === skill.id"
              title="Eliminar"
            >
              @if (deletingId() === skill.id) {
                <span class="spinner-border spinner-border-sm"></span>
              } @else {
                <i class="mdi mdi-close"></i>
              }
            </button>
          </div>
        }
      </div>
    } @else if (!showForm()) {
      <div class="text-center py-4">
        <i class="mdi mdi-star-outline text-muted fs-1"></i>
        <p class="text-muted mb-0">No has agregado habilidades</p>
        <button
          type="button"
          class="btn btn-link btn-sm"
          (click)="toggleForm()"
        >
          Agregar primera habilidad
        </button>
      </div>
    }
  </div>
</div>
