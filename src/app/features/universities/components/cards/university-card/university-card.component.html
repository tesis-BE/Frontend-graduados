<div class="card shadow-sm h-100">
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <h5 class="card-title mb-0 text-truncate" [title]="university.name">
        {{ university.name }}
      </h5>
      <span
        class="badge"
        [ngClass]="{
          'bg-success-subtle text-success': university.isActive,
          'bg-danger-subtle text-danger': !university.isActive,
        }"
      >
        {{ university.isActive ? "Activa" : "Inactiva" }}
      </span>
    </div>

    <p class="card-text text-muted small mb-2" *ngIf="university.code">
      Código interno: <strong>{{ university.code }}</strong>
    </p>

    <p
      class="card-text flex-grow-1"
      [class.text-muted]="!university.description"
    >
      {{ university.description || "Sin descripción registrada." }}
    </p>

    <div
      class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top"
    >
      <small class="text-muted">
        Creada el {{ university.createdAt | date: "dd/MM/yyyy" }}
      </small>
      <button type="button" class="btn btn-sm btn-outline-primary" disabled>
        Ver detalles
      </button>
    </div>
  </div>
</div>
