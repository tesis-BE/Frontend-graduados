<div class="row g-3">
  <ng-container *ngIf="!isLoading; else loadingTemplate">
    <ng-container *ngIf="!errorMessage; else errorTemplate">
      <ng-container
        *ngIf="universities && universities.length; else emptyTemplate"
      >
        <div
          class="col-12 col-md-6 col-xl-4"
          *ngFor="let university of universities; trackBy: trackById"
        >
          <app-university-card [university]="university"></app-university-card>
        </div>
      </ng-container>
    </ng-container>
  </ng-container>
</div>

<ng-template #loadingTemplate>
  <div class="col-12">
    <div class="card shadow-sm">
      <div class="card-body text-center py-5">
        <div class="spinner-border text-primary mb-3" role="status"></div>
        <p class="mb-0 text-muted">Cargando extensiones universitarias...</p>
      </div>
    </div>
  </div>
</ng-template>

<ng-template #errorTemplate>
  <div class="col-12">
    <div
      class="alert alert-danger d-flex justify-content-between align-items-center"
      role="alert"
    >
      <span>{{ errorMessage }}</span>
      <button
        type="button"
        class="btn btn-sm btn-outline-light"
        (click)="onRetry()"
      >
        Reintentar
      </button>
    </div>
  </div>
</ng-template>

<ng-template #emptyTemplate>
  <div class="col-12">
    <div class="card shadow-sm">
      <div class="card-body text-center py-5">
        <p class="mb-2 fw-semibold">Aún no tienes extensiones registradas</p>
        <p class="mb-0 text-muted">
          Crea una nueva extensión universitaria para comenzar a gestionarla.
        </p>
      </div>
    </div>
  </div>
</ng-template>
