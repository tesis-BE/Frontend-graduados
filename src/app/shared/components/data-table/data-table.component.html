<div class="table-container">
  <div *ngIf="loading" class="spinner-overlay">
    <div class="spinner"></div>
  </div>

  <table class="table">
    <thead>
      <tr>
        <th
          *ngFor="let column of columns"
          [style.width]="column.width"
          [class.sortable]="column.sortable"
          (click)="sort(column)"
        >
          <span>{{ column.label }}</span>
          <i
            *ngIf="column.sortable && sortBy === column.key"
            [class]="
              sortOrder === 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'
            "
          ></i>
        </th>
        <th style="width: 100px">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngIf="data.length === 0">
        <td [attr.colspan]="columns.length + 1" class="empty-message">
          {{ emptyMessage }}
        </td>
      </tr>
      <tr *ngFor="let row of data" (click)="onRowClick(row)" class="data-row">
        <td *ngFor="let column of columns">
          {{ getCellValue(row, column) }}
        </td>
        <td class="actions">
          <button
            class="btn-action btn-edit"
            (click)="onActionClick('edit', row, $event)"
            title="Editar"
          >
            <i class="bi bi-pencil"></i>
          </button>
          <button
            class="btn-action btn-delete"
            (click)="onActionClick('delete', row, $event)"
            title="Eliminar"
          >
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="pagination" *ngIf="pages.length > 1">
    <button
      class="btn-pagination"
      (click)="prevPage()"
      [disabled]="currentPage === 1"
    >
      <i class="bi bi-chevron-left"></i>
    </button>

    <button
      *ngFor="let page of pages"
      class="btn-pagination"
      [class.active]="page === currentPage"
      (click)="goToPage(page)"
    >
      {{ page }}
    </button>

    <button
      class="btn-pagination"
      (click)="nextPage()"
      [disabled]="currentPage === pages.length"
    >
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>

  <div class="table-info" *ngIf="total > 0">
    <span
      >Mostrando {{ (currentPage - 1) * pageSize + 1 }} de
      {{ Math.min(currentPage * pageSize, total) }} de
      {{ total }} registros</span
    >
  </div>
</div>
